name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests (mocked inference)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: supportflow_ci
          POSTGRES_PASSWORD: supportflow_ci_password
          POSTGRES_DB: supportflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportflow_ci -d supportflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      APP_NAME: SupportFlow AI CI
      POSTGRES_USER: supportflow_ci
      POSTGRES_PASSWORD: supportflow_ci_password
      POSTGRES_DB: supportflow_test
      DATABASE_URL: postgresql+psycopg://supportflow_ci:supportflow_ci_password@127.0.0.1:5432/supportflow_test
      INFERENCE_FIXTURE: "true"
      OLLAMA_BASE_URL: http://127.0.0.1:9
      OLLAMA_MODEL: qwen3:1.7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q
    # Note: CI uses mocked/fixture inference only — no Ollama download.

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          FASTAPI_BASE_URL: http://127.0.0.1:8000
