# Isolated acceptance stack — separate project/volumes from development.
# Usage:
#   docker compose -p supportflow-acceptance --env-file .env.acceptance \
#     -f docker-compose.acceptance.yml up -d
# Does not reference development volume `postgres_data`.

name: supportflow-acceptance

services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_acceptance_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - acceptance

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: supportflow-api:0.3.2
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      APP_ENV: acceptance
      APP_NAME: ${APP_NAME:-SupportFlow AI Acceptance}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      INFERENCE_FIXTURE: "true"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: "5"
      OLLAMA_INFERENCE_TIMEOUT_SECONDS: "60"
      OLLAMA_NUM_CTX: "2048"
      OLLAMA_NUM_PREDICT: "128"
      OLLAMA_MAX_CONCURRENCY: "1"
      OLLAMA_TEMPERATURE: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - acceptance

  migrate:
    image: supportflow-api:0.3.2
    profiles: ["tools"]
    environment:
      APP_ENV: acceptance
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - acceptance

  seed:
    image: supportflow-api:0.3.2
    profiles: ["tools"]
    environment:
      APP_ENV: acceptance
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "-m", "app.seed"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - acceptance

volumes:
  postgres_acceptance_data:

networks:
  acceptance:
    driver: bridge
